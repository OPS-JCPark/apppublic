<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 목록</title>
<meta name="description" content="개발한 앱의 소개와 개인정보처리방침">
<style>
  :root { --text:#2b2b2b; --sub:#6f6c66; --accent:#2f80ed; --bg:#f7f5f0; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; line-height:1.7; }
  main { max-width:640px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .lead { color:var(--sub); font-size:16px; margin:0 0 28px; }
  .app { display:flex; gap:16px; align-items:center; background:#fff; border-radius:16px; padding:16px 18px; margin-bottom:12px; box-shadow:0 3px 10px rgba(122,106,80,.08); }
  .app img { width:64px; height:64px; border-radius:16px; flex:none; }
  .app h2 { font-size:18px; margin:0; }
  .app p { margin:2px 0 6px; color:var(--sub); font-size:14px; }
  .app a { color:var(--accent); font-size:14px; font-weight:700; text-decoration:none; margin-right:14px; }
  footer { margin-top:40px; font-size:13px; color:var(--sub); }
  footer a { color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>앱 목록</h1>
  <p class="lead">각 앱의 소개와 개인정보처리방침을 확인할 수 있어요.</p>

  <!-- 새 앱은 아래 블록을 복사해 추가 (폴더 이름 = 패키지명 끝부분) -->
  <div class="app">
    <img src="myfridge/icon.png" alt="냉장고콕 아이콘">
    <div>
      <h2>냉장고콕</h2>
      <p>소비기한 알림 · 가격 기록 · 추천 레시피</p>
      <a href="myfridge/">앱 소개</a><a href="myfridge/privacy/">개인정보처리방침</a>
    </div>
  </div>

  <footer>문의: <a href="mailto:skymaund@gmail.com">skymaund@gmail.com</a></footer>
</main>
</body>
</html>
